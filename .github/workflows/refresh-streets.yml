name: Refresh street list

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 0"

permissions:
  contents: write

jobs:
  streets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-streets.mjs
      - name: Commit
        run: |
          git config user.name "tlv-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/streets.json
          git diff --cached --quiet && exit 0
          git commit -m "Refresh street list"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
