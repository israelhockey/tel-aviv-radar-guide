name: Refresh places from OpenStreetMap

on:
  schedule:
    - cron: "17 1 * * *" # every night, 04:17 Israel summer time
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-places
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-places.mjs
      - run: node scripts/fetch-rail.mjs
      - name: Commit if changed
        run: |
          git add public/data/places.json public/data/rail.json
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "tlv-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh places and rail from OpenStreetMap"
          git pull --rebase origin main
          git push
