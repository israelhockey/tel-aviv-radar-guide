name: Refresh events and news

on:
  schedule:
    - cron: "23 */2 * * *" # every two hours
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-feeds
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-feeds.mjs
      - name: Commit if changed
        run: |
          git add public/data/events.json public/data/news.json public/data/venues.json
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "tlv-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh events and news"
          git pull --rebase origin main
          git push
