name: Refresh city layers

on:
  schedule:
    - cron: "41 2 * * *" # nightly
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-city
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-city.mjs
        continue-on-error: true
      - run: node scripts/fetch-food-photos.mjs
        continue-on-error: true
      - run: node scripts/fetch-jobs.mjs
        continue-on-error: true
      - name: Commit if changed
        run: |
          [ -f public/data/city.json ] && git add public/data/city.json
          [ -f public/data/food-photos.json ] && git add public/data/food-photos.json
          [ -f public/data/jobs.json ] && git add public/data/jobs.json
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "tlv-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh city layers"
          git pull --rebase origin main
          git push
